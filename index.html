<!doctype html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Einsatz &amp; Rapport – Berner Oberland Charterschiff AG</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=Figtree:wght@400;500;600&display=swap">
<style>
:root{--bg:#EDF2F4;--sf:#fff;--ink:#0F2230;--mut:#5B6F7C;--ln:#D2DCE2;--pri:#0E4A6B;--pri-ink:#fff;--acc:#B27A1C;--bad:#B3402F;--ok:#2B7A57;--tint:#E3EDF2;--abs:#D9A441;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0C1A22;--sf:#14262F;--ink:#E6EEF2;--mut:#93A8B3;--ln:#25404C;--pri:#5DB1DC;--pri-ink:#07202D;--acc:#E0B04F;--bad:#F08A78;--ok:#6CC49B;--tint:#1B323D;--abs:#B8862B;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0C1A22;--sf:#14262F;--ink:#E6EEF2;--mut:#93A8B3;--ln:#25404C;--pri:#5DB1DC;--pri-ink:#07202D;--acc:#E0B04F;--bad:#F08A78;--ok:#6CC49B;--tint:#1B323D;--abs:#B8862B;color-scheme:dark}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 "Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;padding-bottom:84px;-webkit-text-size-adjust:100%}
body.lock{overflow:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--pri);z-index:30}
h1,h2,h3{font-family:"Bricolage Grotesque","Figtree",system-ui,sans-serif;margin:0}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--pri);color:var(--pri-ink);padding:10px 16px 12px}
header small{display:block;opacity:.8;font-size:12px}
header h1{font-size:20px;line-height:1.2}
main{padding:12px;max-width:900px;margin:0 auto}
nav{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;background:var(--sf);border-top:1px solid var(--ln);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;border:0;background:none;color:var(--mut);padding:9px 0 8px;font:600 12px "Figtree",sans-serif;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer}
nav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--pri)}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:12px;padding:12px;margin-bottom:12px}
.card h2{font-size:16px;margin-bottom:8px}
.muted{color:var(--mut);font-size:13px}
.btn{border:1px solid var(--pri);background:var(--pri);color:var(--pri-ink);border-radius:10px;padding:10px 14px;font:600 14px "Figtree",sans-serif;cursor:pointer;min-height:42px}
.btn.sec{background:transparent;color:var(--pri)}
.btn.bad{background:transparent;color:var(--bad);border-color:var(--bad)}
.btn.sm{padding:6px 10px;min-height:34px;font-size:13px}
.btn.full{width:100%}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.seg{display:flex;background:var(--tint);border-radius:10px;padding:3px;gap:3px;margin-bottom:12px}
.seg button{flex:1;border:0;background:none;color:var(--mut);padding:8px;border-radius:8px;font:600 14px "Figtree",sans-serif;cursor:pointer}
.seg button.on{background:var(--sf);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.15)}
.fld{margin-bottom:10px}
.fld>label{display:block;font-size:13px;color:var(--mut);margin-bottom:3px;font-weight:500}
input,select,textarea{width:100%;font:16px "Figtree",sans-serif;background:var(--bg);color:var(--ink);border:1px solid var(--ln);border-radius:8px;padding:9px 10px;min-height:42px}
input[type=checkbox]{width:auto;min-height:0}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible{outline:2px solid var(--pri);outline-offset:1px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.list .it{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--ln);cursor:pointer}
.list .it:last-child{border-bottom:0}
.dot{width:10px;height:10px;border-radius:50%;flex:none;margin-top:6px}
.it .g{flex:1;min-width:0}
.it .t{font-weight:600}
.it .v{font-weight:600;white-space:nowrap}
.day{font-family:"Bricolage Grotesque",sans-serif;font-weight:600;font-size:13px;color:var(--mut);margin:14px 0 2px}
.tag{display:inline-block;font-size:11px;font-weight:600;border-radius:6px;padding:1px 6px;background:var(--tint);color:var(--mut);margin-left:4px}
.tag.bad{background:transparent;border:1px solid var(--bad);color:var(--bad)}
.tag.ok{background:transparent;border:1px solid var(--ok);color:var(--ok)}
.timer{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.big{font-family:"Bricolage Grotesque",sans-serif;font-size:30px;font-weight:700}
.sum{display:flex;gap:16px;margin-bottom:10px}
.sum div{flex:1}.sum b{display:block;font:700 20px "Bricolage Grotesque",sans-serif}
.chip{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--ln);border-radius:999px;padding:5px 10px;font-size:13px;background:var(--sf);cursor:pointer;color:var(--ink)}
.chip.on{background:var(--pri);color:var(--pri-ink);border-color:var(--pri)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.wd{display:flex;gap:6px}
.wd label{flex:1;text-align:center;border:1px solid var(--ln);border-radius:8px;padding:8px 0;cursor:pointer;font-weight:600;font-size:13px;color:var(--mut)}
.wd input{display:none}
.wd input:checked+span{color:var(--pri-ink)}
.wd label:has(input:checked){background:var(--pri);border-color:var(--pri);color:var(--pri-ink)}
/* Plan */
.grid-wrap{overflow-x:auto;border:1px solid var(--ln);border-radius:10px;background:var(--sf)}
.g{display:inline-block;min-width:100%}
.gr{display:flex;height:34px;border-bottom:1px solid var(--ln)}
.gr.hd{height:auto;min-height:20px}
.gn{position:sticky;left:0;z-index:2;flex:none;width:92px;background:var(--sf);border-right:1px solid var(--ln);padding:0 6px;display:flex;align-items:center;font-size:12px;font-weight:600;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.gc{flex:none;width:var(--cw);border-right:1px solid color-mix(in srgb,var(--ln) 55%,transparent);position:relative;cursor:pointer}
.gc.we{background-image:linear-gradient(color-mix(in srgb,var(--mut) 14%,transparent),color-mix(in srgb,var(--mut) 14%,transparent))}
.gc.as{border-right-color:rgba(255,255,255,.35)}
.gc.ab{background-image:repeating-linear-gradient(45deg,var(--abs) 0 3px,transparent 3px 6px)}
.gc.bl{background-image:linear-gradient(color-mix(in srgb,var(--bad) 22%,transparent),color-mix(in srgb,var(--bad) 22%,transparent))}
.gc.as.we{background-image:linear-gradient(rgba(255,255,255,.25),rgba(255,255,255,.25))}
.gc.x{box-shadow:inset 0 0 0 2px var(--bad)}
.gc.td{border-left:2px solid var(--acc)}
.gh{flex:none;width:var(--cw);text-align:center;font-size:10px;line-height:1.15;color:var(--mut);padding:2px 0;border-right:1px solid color-mix(in srgb,var(--ln) 55%,transparent)}
.gh b{display:block;font-size:12px;color:var(--ink)}
.gh.we{background:color-mix(in srgb,var(--mut) 14%,transparent)}
.gm{flex:none;font:600 11px "Figtree",sans-serif;padding:3px 4px;border-right:1px solid var(--ln);overflow:hidden;white-space:nowrap}
.gb{background-image:repeating-linear-gradient(45deg,var(--bad) 0 3px,transparent 3px 6px)}
.leg{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12px;color:var(--mut);margin:8px 0}
.leg i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-2px;margin-right:4px}
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th,table.t td{padding:6px 4px;border-bottom:1px solid var(--ln);text-align:left}
table.t td.r,table.t th.r{text-align:right}
/* Sheet */
#sheet[hidden]{display:none}
.sh-back{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:40}
.sh{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--sf);border-radius:16px 16px 0 0;max-height:92%;display:flex;flex-direction:column;max-width:700px;margin:0 auto;padding-bottom:env(safe-area-inset-bottom,0px)}
.sh-h{display:flex;justify-content:space-between;align-items:center;padding:14px 16px 8px;font:700 17px "Bricolage Grotesque",sans-serif}
.sh-h .x{border:0;background:none;font-size:20px;color:var(--mut);cursor:pointer;padding:4px 8px}
.sh-b{overflow-y:auto;padding:4px 16px 18px}
.warn{background:color-mix(in srgb,var(--bad) 12%,transparent);border:1px solid var(--bad);border-radius:8px;padding:8px 10px;font-size:13px;margin:8px 0}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:10px;font-size:14px;z-index:60;max-width:90%}
#toast[hidden]{display:none}
.thumb{width:56px;height:56px;object-fit:cover;border-radius:8px;border:1px solid var(--ln);flex:none}
.prev{max-width:100%;max-height:240px;border-radius:8px;border:1px solid var(--ln);margin-top:6px}
.empty{text-align:center;padding:22px 10px;color:var(--mut)}
@media print{body *{visibility:hidden}#rep,#rep *{visibility:visible}#rep{position:absolute;left:0;top:0;width:100%}body::before{display:none}}
</style>
</head>
<body>
<header><small id="co"></small><h1 id="ttl"></h1></header>
<main id="app"></main>
<div id="sheet" hidden></div>
<div id="toast" hidden></div>
<nav>
 <button data-a="tab" data-t="time"><svg viewBox="0 0 24 24"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l3 2M9 2h6"/></svg>Erfassen</button>
 <button data-a="tab" data-t="plan"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4M7 15h4"/></svg>Planung</button>
 <button data-a="tab" data-t="rep"><svg viewBox="0 0 24 24"><path d="M6 3h9l4 4v14H6z"/><path d="M14 3v5h5M9 13h7M9 17h7"/></svg>Rapport</button>
 <button data-a="tab" data-t="data"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 0 0-.1-1.2l2-1.5-2-3.4-2.3 1a7 7 0 0 0-2-1.2L14.3 3h-4l-.4 2.7a7 7 0 0 0-2 1.2l-2.3-1-2 3.4 2 1.5A7 7 0 0 0 5 12c0 .4 0 .8.1 1.2l-2 1.5 2 3.4 2.3-1a7 7 0 0 0 2 1.2l.4 2.7h4l.4-2.7a7 7 0 0 0 2-1.2l2.3 1 2-3.4-2-1.5c.1-.4.1-.8.1-1.2z"/></svg>Daten</button>
</nav>
<script>
"use strict";
/* ---------- Helfer ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-3);
const pad=n=>String(n).padStart(2,"0");
const iso=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const parse=s=>{const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)};
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return iso(d)};
const today=()=>iso(new Date());
const nowT=()=>{const d=new Date();return pad(d.getHours())+":"+pad(d.getMinutes())};
const WD=["So","Mo","Di","Mi","Do","Fr","Sa"];
const MON=["Januar","Februar","März","April","Mai","Juni","Juli","August","September","Oktober","November","Dezember"];
const fmtD=s=>{const d=parse(s);return pad(d.getDate())+"."+pad(d.getMonth()+1)+"."+d.getFullYear()};
const fmtS=s=>{const d=parse(s);return WD[d.getDay()]+" "+pad(d.getDate())+"."+pad(d.getMonth()+1)+"."};
const nf=new Intl.NumberFormat("de-CH",{minimumFractionDigits:2,maximumFractionDigits:2});
const chf=n=>nf.format(n||0);
const mins=(a,b)=>{const [h1,m1]=a.split(":").map(Number),[h2,m2]=b.split(":").map(Number);let d=(h2*60+m2)-(h1*60+m1);if(d<=0)d+=1440;return d};
const hrs=t=>Math.max(0,mins(t.s,t.e)-(t.b||0))/60;
const eachDay=(f,t)=>{const r=[];let d=f;while(d<=t){r.push(d);d=addDays(d,1)}return r};
const monthStart=s=>s.slice(0,8)+"01";
const monthEnd=s=>{const d=parse(s);return iso(new Date(d.getFullYear(),d.getMonth()+1,0))};
const PAL=["#0E6BA8","#2E8B6E","#B27A1C","#8A4FA0","#C2523B","#3E7F8C","#6B7A2A","#A24B6B"];

/* ---------- Daten ---------- */
const KEY="bocsag-einsatz-v1";
const DEF=()=>({v:1,company:"Berner Oberland Charterschiff AG",me:"",
 locations:[{id:"l1",name:"MS Oberhofen (an Bord)",color:PAL[0]},{id:"l2",name:"Hofstetten-Ländte",color:PAL[1]},{id:"l3",name:"Büro Thun",color:PAL[2]}],
 activities:[{id:"a1",name:"Fahrt / Schiffsführung"},{id:"a2",name:"Service an Bord"},{id:"a3",name:"Catering"},{id:"a4",name:"Reinigung & Unterhalt"},{id:"a5",name:"Vorbereitung & Büro"},{id:"a6",name:"Werft / Winterunterhalt"}],
 cats:[{id:"c1",name:"Verpflegung"},{id:"c2",name:"Treibstoff"},{id:"c3",name:"Material"},{id:"c4",name:"Reise / Parkplatz"},{id:"c5",name:"Übernachtung"},{id:"c6",name:"Sonstiges"}],
 employees:[],absences:[],blocks:[],assigns:[],times:[],exps:[],reports:[],timer:null,last:{},
 ui:{tab:"time",sub:"zeit",all:false,planStart:today().slice(0,7),span:1,rf:null}});
function load(){try{const r=localStorage.getItem(KEY);return r?JSON.parse(r):null}catch(e){return null}}
let S=Object.assign(DEF(),load()||{});
S.ui=Object.assign(DEF().ui,S.ui||{});
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast("Speichern im Browser nicht möglich")}}
const idb={db:null,mem:{},
 async open(){if(this.db)return this.db;try{this.db=await new Promise((res,rej)=>{const r=indexedDB.open("bocsag-belege",1);r.onupgradeneeded=()=>r.result.createObjectStore("r");r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}catch(e){this.db=null}return this.db},
 async tx(mode,fn){const db=await this.open();if(!db)return null;return new Promise(res=>{try{const q=fn(db.transaction("r",mode).objectStore("r"));q.onsuccess=()=>res(q.result);q.onerror=()=>res(null)}catch(e){res(null)}})},
 async put(k,v){const db=await this.open();if(!db){this.mem[k]=v;return}await this.tx("readwrite",s=>s.put(v,k))},
 async get(k){const db=await this.open();if(!db)return this.mem[k]||null;return this.tx("readonly",s=>s.get(k))},
 async del(k){const db=await this.open();if(!db){delete this.mem[k];return}await this.tx("readwrite",s=>s.delete(k))}};
const byId=(arr,id)=>arr.find(x=>x.id===id);
const empName=id=>(byId(S.employees,id)||{name:"?"}).name;
const locOf=id=>byId(S.locations,id)||{name:"–",color:"#888"};
const actName=id=>(byId(S.activities,id)||{name:"–"}).name;
const catName=id=>(byId(S.cats,id)||{name:"–"}).name;
if(!S.me&&S.employees[0])S.me=S.employees[0].id;
let toastT;function toast(m){const t=$("#toast");t.textContent=m;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,2600)}

/* ---------- UI-Bausteine ---------- */
const opts=(list,sel,blank)=>(blank!=null?`<option value="">${esc(blank)}</option>`:"")+list.map(x=>`<option value="${esc(x.id)}"${x.id===sel?" selected":""}>${esc(x.name)}</option>`).join("");
const fld=(l,i)=>`<div class="fld"><label>${l}</label>${i}</div>`;
const empOpts=()=>S.employees.filter(e=>e.active!==false);
function sheet(title,body){$("#sheet").innerHTML=`<div class="sh-back" data-a="close"></div><div class="sh" role="dialog" aria-label="${esc(title)}"><div class="sh-h"><span>${title}</span><button class="x" data-a="close" aria-label="Schliessen">✕</button></div><div class="sh-b">${body}</div></div>`;$("#sheet").hidden=false;document.body.classList.add("lock")}
function closeSheet(){$("#sheet").hidden=true;$("#sheet").innerHTML="";document.body.classList.remove("lock");pendingR=undefined}
let askCb=null;
function ask(msg,ok,cb){askCb=cb;sheet("Bitte bestätigen",`<p>${msg}</p><div class="btns"><button class="btn bad" data-a="askok">${ok}</button><button class="btn sec" data-a="close">Abbrechen</button></div>`)}
function showText(title,text){sheet(title,`<p class="muted">Direktes Speichern ist hier nicht verfügbar. Text markieren und kopieren:</p><textarea rows="12" readonly onclick="this.select()">${esc(text)}</textarea>`)}
async function dl(filename,text,type){
 let d=null;try{d=window.claude?await window.claude.use("downloads"):null}catch(e){}
 if(!d){showText(filename,text);return}
 try{await d.save({filename,data:new Blob([text],{type})})}catch(e){if(e&&e.code!=="declined")showText(filename,text)}}
function resizeImage(file,max=1400,q=.72){return new Promise((res,rej)=>{const url=URL.createObjectURL(file);const img=new Image();img.onload=()=>{const sc=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement("canvas");c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);c.getContext("2d").drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);res(c.toDataURL("image/jpeg",q))};img.onerror=()=>{URL.revokeObjectURL(url);rej()};img.src=url})}
let pendingR;

/* ---------- Render ---------- */
function render(){
 const old=document.querySelector(".grid-wrap");const sl=old?old.scrollLeft:0;
 document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.t===S.ui.tab));
 $("#co").textContent=S.company;
 $("#ttl").textContent={time:"Erfassen",plan:"Einsatzplanung",rep:"Rapport & Abrechnung",data:"Stammdaten"}[S.ui.tab];
 $("#app").innerHTML={time:viewTime,plan:viewPlan,rep:viewRep,data:viewData}[S.ui.tab]();
 const w=document.querySelector(".grid-wrap");
 if(w){if(scrollToday){const td=w.querySelector(".gh.td,.gc.td");if(td)w.scrollLeft=Math.max(0,td.offsetLeft-120);scrollToday=false}else w.scrollLeft=sl}
 if(S.ui.tab==="rep")fillReport();
}
let scrollToday=false;
const emptySetup=()=>`<div class="card empty"><h2>Los geht’s</h2><p>Erfasse zuerst die Mitarbeitenden unter «Daten». Standorte, Tätigkeiten und Spesenarten sind für das Charterschiff bereits vorbereitet.</p><div class="btns" style="justify-content:center"><button class="btn" data-a="tab" data-t="data">Mitarbeitende erfassen</button><button class="btn sec" data-a="demo">Beispieldaten laden</button></div></div>`;

/* ---------- Erfassen ---------- */
function viewTime(){
 if(!S.employees.length)return emptySetup();
 if(!byId(S.employees,S.me))S.me=S.employees[0].id;
 const L=S.last||{};const t=S.timer;
 let timer;
 if(t){timer=`<div class="timer"><div><div class="muted">Läuft seit ${(d=>pad(d.getHours())+":"+pad(d.getMinutes()))(new Date(t.start))} · ${esc(locOf(t.loc).name)}</div><div class="big" id="elapsed">${elapsed()}</div><div class="muted">${esc(actName(t.act))}</div></div></div><div class="btns"><button class="btn" data-a="timerstop">Stopp &amp; speichern</button><button class="btn sec" data-a="timerdrop">Verwerfen</button></div>`}
 else{timer=`<div class="row2">${fld("Standort",`<select id="tl">${opts(S.locations,L.loc)}</select>`)}${fld("Tätigkeit",`<select id="ta">${opts(S.activities,L.act)}</select>`)}</div><button class="btn full" data-a="timerstart">Arbeitszeit starten</button>`}
 const ms=monthStart(today()),me=monthEnd(today());
 const mine=x=>S.ui.all||x.emp===S.me;
 const mh=S.times.filter(x=>x.emp===S.me&&x.date>=ms&&x.date<=me).reduce((a,x)=>a+hrs(x),0);
 const mx=S.exps.filter(x=>x.emp===S.me&&x.date>=ms&&x.date<=me).reduce((a,x)=>a+x.amt,0);
 let list="";
 if(S.ui.sub==="zeit"){
  const L2=S.times.filter(mine).sort((a,b)=>(b.date+b.s).localeCompare(a.date+a.s)).slice(0,80);
  let cur="";
  list=L2.map(x=>{let h="";if(x.date!==cur){cur=x.date;h=`<div class="day">${fmtS(x.date)}</div>`}

function planRange(){const [y,m]=S.ui.planStart.split("-").map(Number);return{from:iso(new Date(y,m-1,1)),to:iso(new Date(y,m-1+S.ui.span,0))}}
function stateOf(A,AB,B,d){
 const wd=parse(d).getDay();
 const as=A.filter(a=>a.from<=d&&d<=a.to&&a.wd.includes(wd));
 const ab=AB.find(x=>x.from<=d&&d<=x.to);
 const bl=B.filter(b=>b.from<=d&&d<=b.to);
 const c=[];
 if(as.length&&ab)c.push("abs");
 if(as.some(a=>bl.some(b=>!b.loc||b.loc===a.loc)))c.push("blk");
 if(as.length>1)c.push("dbl");
 return{as,ab,bl,c};
}
const ctx=e=>({A:S.assigns.filter(a=>a.emp===e),AB:S.absences.filter(a=>a.emp===e),B:S.blocks.filter(b=>!b.emp||b.emp===e)});
function viewPlan(){
 if(!S.employees.length)return emptySetup();

 const [y,m]=S.ui.planStart.split("-").map(Number);

 let head;
 if(S.ui.span===1)head=`<div class="gr hd"><div class="gn"></div>${days.map(d=>{const w=parse(d).getDay();return `<div class="gh ${w%6===0?"we":""} ${d===td?"td":""}">${WD[w]}<b>${+d.slice(8)}</b></div>`}).join("")}</div>`;
 else{let ms="";for(let k=0;k<S.ui.span;k++){const dd=new Date(y,m-1+k,1);const n=new Date(y,m+k,0).getDate();ms+=`<div class="gm" style="width:${n*cw}px">${MON[dd.getMonth()]}${k===0||dd.getMonth()===0?" "+dd.getFullYear():""}</div>`}head=`<div class="gr hd"><div class="gn"></div>${ms}</div>`}
 const gb=S.blocks.filter(b=>!b.emp);
 const brow=`<div class="gr"><div class="gn" title="Sperrzeiten">Sperren</div>${days.map(d=>`<div class="gc ${S.blocks.some(b=>b.from<=d&&d<=b.to)?"gb":""}" data-a="blockday" data-d="${d}"></div>`).join("")}</div>`;
 const rows=empOpts().map(e=>{const c=ctx(e.id);return `<div class="gr"><div class="gn">${esc(e.short||e.name)}</div>${days.map(d=>{const st=stateOf(c.A,c.AB,c.B,d);const w=parse(d).getDay();
  const gl=!st.as.length&&st.bl.some(b=>!b.loc);
  const cls=["gc",w%6===0?"we":"",st.as.length?"as":"",st.ab?"ab":"",gl?"bl":"",st.c.length?"x":"",d===td?"td":""].join(" ");
  const bg=st.as.length?`background-color:${locOf(st.as[0].loc).color};`:"";
  return `<div class="${cls}" style="${bg}" data-a="day" data-e="${e.id}" data-d="${d}"></div>`}).join("")}</div>`}).join("");
 // Konflikte & Summen
 const conf=[];const sumr=empOpts().map(e=>{const c=ctx(e.id);let ad=0,ab=0,hh=0;const runs={};
  days.forEach(d=>{const st=stateOf(c.A,c.AB,c.B,d);if(st.as.length){ad++;hh+=st.as.reduce((a,x)=>a+(+x.h||0),0)}if(st.ab)ab++;
   st.c.forEach(k=>{const r=runs[k]||(runs[k]=[]);const l=r[r.length-1];if(l&&addDays(l[1],1)===d)l[1]=d;else r.push([d,d])})});
  Object.entries(runs).forEach(([k,r])=>r.forEach(x=>conf.push({e:e.id,k,from:x[0],to:x[1]})));
  return `<tr><td>${esc(e.name)}</td><td class="r">${ad}</td><td class="r">${chf(hh)}</td><td class="r">${ab}</td></tr>`}).join("");
 const KT={abs:"Einsatz trotz Absenz",blk:"Einsatz in Sperrzeit",dbl:"Doppelt eingeplant"};
 const confH=conf.length?conf.map(c=>`<div class="it" data-a="day" data-e="${c.e}" data-d="${c.from}"><span class="dot" style="background:var(--bad)"></span><div class="g"><div class="t">${esc(empName(c.e))}</div><div class="muted">${KT[c.k]} · ${c.from===c.to?fmtD(c.from):fmtD(c.from)+" – "+fmtD(c.to)}</div></div></div>`).join(""):`<div class="muted">Keine Konflikte im Zeitraum.</div>`;

 <div class="leg">${S.locations.map(l=>`<span><i style="background:${l.color}"></i>${esc(l.name)}</span>`).join("")}<span><i style="background:repeating-linear-gradient(45deg,var(--abs) 0 3px,transparent 3px 6px);border:1px solid var(--ln)"></i>Absenz</span><span><i style="background:repeating-linear-gradient(45deg,var(--bad) 0 3px,transparent 3px 6px)"></i>Sperrzeit</span><span><i style="box-shadow:inset 0 0 0 2px var(--bad)"></i>Konflikt</span></div>

 <div class="card"><h2>Auslastung im Zeitraum</h2><table class="t"><tr><th>Mitarbeiter/in</th><th class="r">Einsatztage</th><th class="r">Soll-Std.</th><th class="r">Absenztage</th></tr>${sumr}</table></div>
 <div class="card"><h2>Alle Einträge</h2><div class="list">${planList()}</div></div>`;
}

function planWarn(f,kind,id){
 const g=n=>f[n]?f[n].value:"";const emp=g("emp"),from=g("from"),to=g("to");const out=[];
 if(!from||!to||to<from){return["Das Enddatum liegt vor dem Startdatum."]}
 if(kind==="assign"){
  const wd=[...f.querySelectorAll("[name=wd]:checked")].map(x=>+x.value);const loc=g("loc");
  const A=S.assigns.filter(a=>a.emp===emp&&a.id!==id).concat([{id:"tmp",emp,loc,from,to,wd}]);
  const c=ctx(emp);const n={abs:0,blk:0,dbl:0};
  eachDay(from,to).forEach(d=>{if(!wd.includes(parse(d).getDay()))return;const st=stateOf(A,c.AB,c.B,d);if(!st.as.some(a=>a.id==="tmp"))return;
   if(st.ab)n.abs++;if(st.as.some(a=>a.id==="tmp"&&st.bl.some(b=>!b.loc||b.loc===a.loc)))n.blk++;if(st.as.length>1)n.dbl++});
  if(n.abs)out.push(`${n.abs} Einsatztag(e) fallen in eine Absenz.`);if(n.blk)out.push(`${n.blk} Einsatztag(e) fallen in eine Sperrzeit.`);if(n.dbl)out.push(`${n.dbl} Tag(e) sind doppelt eingeplant.`);
 }else if(kind==="abs"){
  const n=eachDay(from,to).filter(d=>S.assigns.some(a=>a.emp===emp&&a.from<=d&&d<=a.to&&a.wd.includes(parse(d).getDay()))).length;
  if(n)out.push(`${n} eingeplante Einsatztag(e) liegen in dieser Absenz.`);
 }else{
  const loc=g("loc"),e2=g("emp");let n=0;
  S.assigns.forEach(a=>{if((loc&&a.loc!==loc)||(e2&&a.emp!==e2))return;eachDay(from,to).forEach(d=>{if(a.from<=d&&d<=a.to&&a.wd.includes(parse(d).getDay()))n++})});
  if(n)out.push(`${n} eingeplante Einsatztag(e) liegen in dieser Sperrzeit.`);
 }
 return out;
}

function rf(){if(!S.ui.rf)S.ui.rf={from:monthStart(today()),to:monthEnd(today()),emp:"",loc:"",status:"open"};return S.ui.rf}
function repSet(f){
 let T=S.times.slice(),E=S.exps.slice();
 if(f.status!=="open"&&f.status!=="all"){T=T.filter(x=>x.rep===f.status);E=E.filter(x=>x.rep===f.status)}
 else{const ok=x=>x.date>=f.from&&x.date<=f.to&&(!f.emp||x.emp===f.emp)&&(!f.loc||x.loc===f.loc)&&(f.status==="all"||!x.rep);T=T.filter(ok);E=E.filter(ok)}
 T.sort((a,b)=>(a.date+a.s).localeCompare(b.date+b.s));E.sort((a,b)=>a.date.localeCompare(b.date));
 return{T,E};
}

const REPCSS=`.paper{background:#fff;color:#14202a;font:13px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;padding:18px;border-radius:10px;margin-bottom:12px}.paper h1{font-size:20px;margin:0 0 2px}.paper h2{font-size:15px;margin:20px 0 6px;border-bottom:2px solid #0E4A6B;padding-bottom:3px;color:#14202a}.paper h3{font-size:13px;margin:12px 0 4px}.paper table{width:100%;border-collapse:collapse;font-size:12px;margin:4px 0}.paper th,.paper td{padding:4px 5px;border-bottom:1px solid #d9e1e6;text-align:left;vertical-align:top}.paper th{background:#eef3f6;font-weight:600}.paper .r{text-align:right;white-space:nowrap}.paper .tot td{font-weight:700;border-top:2px solid #14202a}.paper .meta{color:#52636f;font-size:12px}.paper .warn{background:#fdf0ec;color:#8a2d1d;border:0;padding:6px 8px;border-radius:6px;margin:8px 0}.paper .sig{display:flex;gap:30px;margin-top:34px}.paper .sig div{flex:1;border-top:1px solid #14202a;padding-top:4px;font-size:11px;color:#52636f}.paper .bel{break-inside:avoid;margin:10px 0}.paper .bel img{max-width:100%;max-height:520px;border:1px solid #ccd6dc}.paper .pb{break-before:page}.paper .tw{overflow-x:auto}`;

function repHTML(f,T,E,imgs){
 let bn=0;const bno={};E.forEach(e=>{if(e.r)bno[e.id]="B"+(++bn)});
 const missing=E.filter(e=>!e.r).length;
 const ids=[...new Set(T.map(x=>x.emp).concat(E.map(x=>x.emp)))];
 const emps=S.employees.filter(e=>ids.includes(e.id));
 const isRep=f.status!=="open"&&f.status!=="all";
 let h=`<h1>Arbeitsrapport &amp; Spesenabrechnung</h1><div class="meta">${esc(S.company)}<br>${isRep?"Rapport "+esc(f.status):"Zeitraum "+fmtD(f.from)+" – "+fmtD(f.to)}${!isRep&&f.loc?" · "+esc(locOf(f.loc).name):""} · erstellt am ${fmtD(today())}</div>`;
 if(!T.length&&!E.length)return `<div class="paper">${h}<p>Keine Einträge für diese Auswahl.</p></div>`;
 if(missing)h+=`<div class="warn">${missing} Spesenposition(en) ohne Beleg.</div>`;
 let gH=0,gE=0,gP=0,gL=0;
 emps.forEach(e=>{
  const t=T.filter(x=>x.emp===e.id),x=E.filter(y=>y.emp===e.id);
  const th=t.reduce((a,z)=>a+hrs(z),0);
  const byL={},byA={};t.forEach(z=>{byL[z.loc]=(byL[z.loc]||0)+hrs(z);byA[z.act]=(byA[z.act]||0)+hrs(z)});
  const priv=x.filter(z=>z.paid!=="firma").reduce((a,z)=>a+z.amt,0),firm=x.filter(z=>z.paid==="firma").reduce((a,z)=>a+z.amt,0);
  const pay=th*(e.rate||0);gH+=th;gE+=priv;gP+=pay;gL+=firm;
  h+=`<h2>${esc(e.name)}</h2>`;
  if(t.length)h+=`<h3>Arbeitszeit</h3><div class="tw"><table><tr><th>Datum</th><th>Standort</th><th>Tätigkeit</th><th>Zeit</th><th class="r">Std.</th></tr>${t.map(z=>`<tr><td>${fmtS(z.date)}</td><td>${esc(locOf(z.loc).name)}</td><td>${esc(actName(z.act))}${z.note?`<br><span class="meta">${esc(z.note)}</span>`:""}</td><td>${esc(z.s)}–${esc(z.e)}${z.b?`<br><span class="meta">Pause ${z.b} Min.</span>`:""}</td><td class="r">${chf(hrs(z))}</td></tr>`).join("")}<tr class="tot"><td colspan="4">Total Stunden</td><td class="r">${chf(th)}</td></tr></table></div>
  <div class="tw"><table><tr><th colspan="2">Nach Standort</th><th colspan="2">Nach Tätigkeit</th></tr><tr><td colspan="2" style="padding:0"><table>${Object.entries(byL).map(([k,v])=>`<tr><td>${esc(locOf(k).name)}</td><td class="r">${chf(v)}</td></tr>`).join("")}</table></td><td colspan="2" style="padding:0"><table>${Object.entries(byA).map(([k,v])=>`<tr><td>${esc(actName(k))}</td><td class="r">${chf(v)}</td></tr>`).join("")}</table></td></tr></table></div>`;
  if(x.length)h+=`<h3>Spesen</h3><div class="tw"><table><tr><th>Datum</th><th>Art / Standort</th><th>Bezahlt</th><th>Beleg</th><th class="r">CHF</th></tr>${x.map(z=>`<tr><td>${fmtS(z.date)}</td><td>${esc(catName(z.cat))}<br><span class="meta">${esc(locOf(z.loc).name)}${z.note?" · "+esc(z.note):""}</span></td><td>${z.paid==="firma"?"Firma":"privat"}</td><td>${bno[z.id]||"fehlt"}</td><td class="r">${chf(z.amt)}</td></tr>`).join("")}</table></div>`;
  h+=`<h3>Abrechnung</h3><table>${e.rate?`<tr><td>Arbeitszeit ${chf(th)} h × CHF ${chf(e.rate)}</td><td class="r">CHF ${chf(pay)}</td></tr>`:`<tr><td>Arbeitszeit</td><td class="r">${chf(th)} h</td></tr>`}<tr><td>Spesen, privat ausgelegt (zu erstatten)</td><td class="r">CHF ${chf(priv)}</td></tr>${firm?`<tr><td class="meta">Spesen über Firma (nur Nachweis)</td><td class="r meta">CHF ${chf(firm)}</td></tr>`:""}<tr class="tot"><td>Total Auszahlung</td><td class="r">CHF ${chf(pay+priv)}</td></tr></table>`;
 });
 if(emps.length>1)h+=`<h2>Gesamt</h2><table><tr><td>Stunden</td><td class="r">${chf(gH)} h</td></tr><tr><td>Arbeitszeit-Betrag</td><td class="r">CHF ${chf(gP)}</td></tr><tr><td>Spesen zu erstatten</td><td class="r">CHF ${chf(gE)}</td></tr><tr class="tot"><td>Total</td><td class="r">CHF ${chf(gP+gE)}</td></tr></table>`;
 h+=`<div class="sig"><div>Mitarbeiter/in – Datum, Unterschrift</div><div>Visum Geschäftsleitung</div></div>`;
 const withR=E.filter(e=>e.r&&imgs[e.id]);
 if(withR.length)h+=`<div class="pb"></div><h2>Belege</h2>${withR.map(e=>`<div class="bel"><b>${bno[e.id]}</b> · ${fmtD(e.date)} · ${esc(empName(e.emp))} · ${esc(catName(e.cat))} · CHF ${chf(e.amt)}<br><img src="${imgs[e.id]}" alt="Beleg ${bno[e.id]}"></div>`).join("")}`;
 return `<div class="paper">${h}</div>`;
}

 reopen(e){const r=byId(S.reports,e.dataset.id);closeSheet();ask(`Abschluss von ${esc(r.no)} aufheben? Zeiten und Spesen werden wieder bearbeitbar.`,"Aufheben",()=>{S.times.forEach(x=>{if(x.rep===r.no)delete x.rep});S.exps.forEach(x=>{if(x.rep===r.no)delete x.rep});S.reports=S.reports.filter(x=>x.id!==r.id);if(rf().status===r.no)rf().status="open";save();render()})},
 newemp(){sheet("Mitarbeiter/in",empForm())},editemp(e){sheet("Mitarbeiter/in",empForm(byId(S.employees,e.dataset.id)))},
 delemp(e){const id=e.dataset.id;const used=["times","exps","assigns","absences"].some(n=>S[n].some(x=>x.emp===id));if(used){toast("Hat Einträge – bitte auf inaktiv setzen");return}ask("Mitarbeiter/in löschen?","Löschen",()=>{S.employees=S.employees.filter(x=>x.id!==id);save();render()})},
 newloc(){sheet("Standort",simpleForm("loc"))},editloc(e){sheet("Standort",simpleForm("loc",byId(S.locations,e.dataset.id)))},
 newact(){sheet("Tätigkeit",simpleForm("act"))},editact(e){sheet("Tätigkeit",simpleForm("act",byId(S.activities,e.dataset.id)))},
 newcat(){sheet("Spesenart",simpleForm("cat"))},editcat(e){sheet("Spesenart",simpleForm("cat",byId(S.cats,e.dataset.id)))},
 delloc(e){delSimple("loc","locations",e.dataset.id)},delact(e){delSimple("act","activities",e.dataset.id)},delcat(e){delSimple("cat","cats",e.dataset.id)},
 demo(){closeSheet();ask("Beispieldaten mit erfundenen Namen zu deinen Daten hinzufügen?","Laden",demo)},
 wipe(){ask("Wirklich ALLE Daten auf diesem Gerät löschen? Das kann nicht rückgängig gemacht werden.","Alles löschen",async()=>{for(const x of S.exps)await idb.del(x.id);S=DEF();save();render()})},
 async expjson(){const r={};for(const x of S.exps)if(x.r){const d=await idb.get(x.id);if(d)r[x.id]=d}dl(`Einsatz-Rapport-Backup_${today()}.json`,JSON.stringify({app:"bocsag-einsatz",S,receipts:r}),"application/json")},
 impjson(){$("#impf").click()}
};
function delSimple(kind,key,id){if(inUse(kind,id)){toast("In Verwendung – kann nicht gelöscht werden");return}ask("Eintrag löschen?","Löschen",()=>{S[key]=S[key].filter(x=>x.id!==id);save();render()})}

document.addEventListener("click",e=>{const b=e.target.closest("[data-a]");if(!b||!A[b.dataset.a])return;if(e.target.closest("form")&&b.type==="submit")return;A[b.dataset.a](b)});
document.addEventListener("input",e=>{const f=e.target.closest("form");if(f&&f.dataset.f==="time")calcHint(f);const c=e.target.dataset;if(c.c==="company"){S.company=e.target.value;save();$("#co").textContent=S.company}});
document.addEventListener("change",async e=>{
 const t=e.target;
 if(t.dataset.c==="me"){S.me=t.value;save();render();return}
 if(t.dataset.r){const f=rf();f[t.dataset.r]=t.value;if(t.dataset.r!=="status"&&(f.status!=="open"&&f.status!=="all"))f.status="open";save();render();return}
 if(t.name==="rcpt"&&t.files[0]){try{pendingR=await resizeImage(t.files[0]);$("#rprev").innerHTML=`<img class="prev" src="${pendingR}" alt="Vorschau">`}catch(x){toast("Bild konnte nicht gelesen werden")}return}
 if(t.id==="impf"&&t.files[0]){const rd=new FileReader();rd.onload=()=>{try{const j=JSON.parse(rd.result);if(!j.S||j.app!=="bocsag-einsatz")throw 0;ask("Backup einlesen? Die aktuellen Daten auf diesem Gerät werden ersetzt.","Einlesen",async()=>{S=Object.assign(DEF(),j.S);S.ui=Object.assign(DEF().ui,S.ui||{});for(const [k,v] of Object.entries(j.receipts||{}))await idb.put(k,v);save();render();toast("Backup eingelesen")})}catch(x){toast("Datei ist kein gültiges Backup")}};rd.readAsText(t.files[0]);t.value=""}
});
document.addEventListener("submit",async e=>{
 e.preventDefault();const f=e.target;const k=f.dataset.f,id=f.dataset.id;const v=n=>f[n]?f[n].value:"";
 if(k==="time"){
  if(v("s")===v("e")){$("#calc").textContent="Von und Bis sind gleich.";return}
  const o={emp:v("emp"),date:v("date"),s:v("s"),e:v("e"),b:+v("b")||0,loc:v("loc"),act:v("act"),note:v("note").trim()};
  if(id)Object.assign(byId(S.times,id),o);else S.times.push(Object.assign({id:uid()},o));
  S.last={loc:o.loc,act:o.act};if(f.dataset.timer){S.timer=null}
 }else if(k==="exp"){
  const o={emp:v("emp"),date:v("date"),amt:Math.round((+v("amt")||0)*100)/100,cat:v("cat"),loc:v("loc"),paid:v("paid"),note:v("note").trim()};
  let x=id?byId(S.exps,id):null;if(x)Object.assign(x,o);else{x=Object.assign({id:uid(),r:false},o);S.exps.push(x)}
  if(pendingR){await idb.put(x.id,pendingR);x.r=true}
 }else if(k==="assign"||k==="abs"||k==="block"){
  const w=planWarn(f,k,id);const btn=$("#sv");
  if(w.length&&!f.dataset.ok){$("#warn").innerHTML=w.map(m=>`<div class="warn">${m}</div>`).join("");f.dataset.ok="1";btn.textContent="Trotzdem speichern";return}
  if(w.length&&w[0].startsWith("Das Enddatum"))return;
  if(k==="assign"){const o={emp:v("emp"),loc:v("loc"),from:v("from"),to:v("to"),wd:[...f.querySelectorAll("[name=wd]:checked")].map(x=>+x.value),h:+v("h")||0,note:v("note").trim()};if(!o.wd.length){$("#warn").innerHTML=`<div class="warn">Mindestens einen Wochentag wählen.</div>`;return}if(id)Object.assign(byId(S.assigns,id),o);else S.assigns.push(Object.assign({id:uid()},o))}
  if(k==="abs"){const o={emp:v("emp"),type:v("type"),from:v("from"),to:v("to"),note:v("note").trim()};if(id)Object.assign(byId(S.absences,id),o);else S.absences.push(Object.assign({id:uid()},o))}
  if(k==="block"){const o={label:v("label").trim(),from:v("from"),to:v("to"),loc:v("loc"),emp:v("emp")};if(id)Object.assign(byId(S.blocks,id),o);else S.blocks.push(Object.assign({id:uid()},o))}
 }else if(k==="emp"){
  const o={name:v("name").trim(),short:v("short").trim()||v("name").trim().split(/\s+/).map(p=>p[0]).join("").toUpperCase(),rate:+v("rate")||0,active:!f.inactive.checked};
  if(id)Object.assign(byId(S.employees,id),o);else{const n=Object.assign({id:uid()},o);S.employees.push(n);if(!S.me)S.me=n.id}
 }else if(k==="loc"||k==="act"||k==="cat"){
  const key={loc:"locations",act:"activities",cat:"cats"}[k];const o={name:v("name").trim()};if(k==="loc")o.color=v("color");
  if(id)Object.assign(byId(S[key],id),o);else S[key].push(Object.assign({id:uid()},o));
 }
 save();closeSheet();render();toast("Gespeichert");
});
if(!S.ui.tab)S.ui.tab="time";
render();
</script>
</body>
</html>
